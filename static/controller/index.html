<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VJ Controller</title>
  <style>
  :root {
    --bg:            #0d0d0d;
    --surface:       #161616;
    --surface-hi:    #1e1e1e;
    --border:        #2a2a2a;
    --border-hi:     #3a3a3a;
    --accent:        #f97316;
    --accent-glow:   rgba(249,115,22,0.12);
    --text:          #e8e8e8;
    --text-muted:    #777;
    --text-dim:      #444;
    --touch:         44px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: monospace;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Tab nav ─────────────────────────────────── */
  nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  nav button {
    flex: 1;
    min-height: var(--touch);
    padding: 0 4px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── Panels ──────────────────────────────────── */
  .panel { flex: 1; overflow-y: auto; padding: 12px; display: none; }
  .panel.active { display: block; }
  .empty { color: var(--text-dim); text-align: center; margin-top: 48px; font-size: 13px; }

  /* ── Clips grid ──────────────────────────────── */
  .clip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
  .clip-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
    color: inherit;
    font: inherit;
    text-align: left;
    width: 100%;
    min-height: var(--touch);
  }
  .clip-card:active,
  .clip-card.active { border-color: var(--accent); background: var(--surface-hi); }
  .clip-card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 3px;
    display: block;
    background: #000;
  }
  .clip-name {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .clip-mode { display: block; font-size: 10px; color: var(--text-muted); }

  /* ── Shared action button ────────────────────── */
  .action-btn {
    display: block;
    width: 100%;
    min-height: var(--touch);
    padding: 0 12px;
    margin: 8px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .action-btn:active { background: var(--surface-hi); }
  .action-btn.primary {
    border-color: var(--accent);
    color: var(--accent);
  }
  .action-btn.primary:active { background: var(--accent-glow); }

  /* ── Icon buttons (square, 44px min) ─────────── */
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: var(--touch);
    min-height: var(--touch);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    padding: 0;
  }
  .icon-btn:active { background: var(--surface-hi); }
  .icon-btn.accent { color: var(--accent); border-color: var(--accent); }

  /* ── Loops ───────────────────────────────────── */
  .loop-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 6px 0;
    overflow: hidden;
  }
  .loop-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 10px 6px;
    gap: 8px;
  }
  .loop-info { flex: 1; min-width: 0; }
  .loop-info strong { display: block; font-size: 14px; }
  .loop-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* filmstrip inside a loop row */
  .filmstrip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 10px 10px;
    scrollbar-width: none;
  }
  .filmstrip::-webkit-scrollbar { display: none; }
  .filmstrip-thumb { flex-shrink: 0; width: 80px; cursor: pointer; }
  .filmstrip-thumb img {
    width: 80px;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 4px;
    background: #000;
    display: block;
    border: 1px solid var(--border);
  }
  .filmstrip-thumb span {
    display: block;
    font-size: 9px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 3px;
  }

  /* Loop editor */
  .step-row {
    display: flex;
    gap: 8px;
    align-items: center;
    min-height: var(--touch);
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .step-row button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: var(--touch);
    min-height: var(--touch);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
  }
  .loop-name-input,
  .clip-select {
    width: 100%;
    min-height: var(--touch);
    padding: 0 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .loop-name-input:focus,
  .clip-select:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* ── Now Playing ──────────────────────────────── */
  .np-status { text-align: center; padding: 28px 12px 16px; }
  .np-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .np-name { font-size: 26px; font-weight: bold; min-height: 32px; }
  .np-type { font-size: 11px; color: var(--accent); margin-top: 4px; min-height: 16px; letter-spacing: 2px; }

  .transition-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .t-btn {
    min-height: 56px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .t-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  #duration-slider { width: 100%; margin: 10px 0; accent-color: var(--accent); }
  #duration-val { text-align: center; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <nav>
    <button class="tab active" data-panel="clips">Clips</button>
    <button class="tab" data-panel="loops">Loops</button>
    <button class="tab" data-panel="now-playing">Now Playing</button>
  </nav>
  <div id="clips"       class="panel active"></div>
  <div id="loops"       class="panel"></div>
  <div id="now-playing" class="panel"></div>

  <script type="module">
    import { renderClipsPanel }     from '/static/controller/clips.js';
    import { renderLoopsPanel }     from '/static/controller/loops.js';
    import { renderNowPlayingPanel } from '/static/controller/now-playing.js';

    const renderers = {
      clips:        renderClipsPanel,
      loops:        renderLoopsPanel,
      'now-playing': renderNowPlayingPanel,
    };

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        const name = tab.dataset.panel;
        const panel = document.getElementById(name);
        panel.classList.add('active');
        renderers[name](panel);
      });
    });

    renderClipsPanel(document.getElementById('clips'));
  </script>
</body>
</html>
